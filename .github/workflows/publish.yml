name: publish

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # npm rejects re-publishing an existing version. Pushing a tag that was
      # already published by hand should stay green, not fail the build.
      - name: Publish
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version --registry https://registry.npmjs.org >/dev/null 2>&1; then
            echo "$NAME@$VERSION is already on npm — skipping publish."
            exit 0
          fi
          npm publish --access public --provenance --registry https://registry.npmjs.org
